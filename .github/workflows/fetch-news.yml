name: Fetch PE News

on:
  schedule:
    - cron: "0 10,15,21 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fetch-news cron endpoint
        run: |
          curl -sf -X GET "${{ secrets.DEPLOYMENT_URL }}/api/cron/fetch-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
